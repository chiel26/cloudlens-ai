name: Build MekLens Dataset

on:
  push:
    paths:
      - ".github/meklens_build_dataset.py"
      - ".github/workflows/meklens-build-dataset.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow imagehash pyyaml kagglehub datasets roboflow

      - name: Build dataset
        run: python .github/meklens_build_dataset.py

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MekLens_Cloud_Training_1000x10
          path: build/MekLens_Cloud_Training_1000x10.zip
          compression-level: 0
          retention-days: 1
